name: Compilar Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      VITE_ADMOB_BANNER_ID: ca-app-pub-9786506046339331/4899184364
      ADMOB_APP_ID: ca-app-pub-9786506046339331~4093369159
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: upload
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verificar secretos obligatorios
        run: |
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID GOOGLE_SERVICES_JSON_B64 KEYSTORE_B64 KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto para $v (ver GUIA.md)"; exit 1; fi
          done

      - name: Compilar web y sincronizar Android
        run: |
          npm ci
          npm run build
          npx cap sync android
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

      - name: Preparar firma
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          # Diagnóstico sin revelar secretos
          if [ "$(sha256sum "$RUNNER_TEMP/upload.jks" | cut -c1-64)" = "12a7a22125efb4ac5b78f02251f09f98776fc798a822be27715343a30d6fee39" ]; then echo "DIAG llave: OK"; else echo "::error::DIAG llave: KEYSTORE_B64 incompleto o incorrecto"; fi
          echo "DIAG largo KEYSTORE_PASSWORD=${#KEYSTORE_PASSWORD} KEY_PASSWORD=${#KEY_PASSWORD} (debe ser 20)"
          if keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then echo "DIAG contraseña: OK"; else echo "::error::DIAG contraseña: KEYSTORE_PASSWORD no abre la llave"; fi

      - name: Compilar APK y AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: agendate-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
